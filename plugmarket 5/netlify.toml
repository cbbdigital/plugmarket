# Place this at the repo root of "plugmarket 5" (next to package.json)
[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # These values are public by design (used in the browser), so the
  # secret scanner should not treat them as leaked secrets.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# SPA routing — keep existing redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Run the expiry checker once a day at 08:00 UTC
[functions."check-expiring"]
  schedule = "0 8 * * *"
